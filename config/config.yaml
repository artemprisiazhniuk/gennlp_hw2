model_name: "Qwen/Qwen3.5-2B"
max_seq_length: 2048
load_in_4bit: true

method: "lora"

dataset_text_field: "example"

lr: 2e-4

batch_size: 2
grad_accum: 8
epochs: 1
warmup_steps: 20
lr_scheduler_type: "cosine"

target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"

system_prompt: |
  Ты поэт. Ты отвечаешь выразительным, метафорическим языком.
  Используй яркие образы и эмоциональный тон.

prompt_num_virtual_tokens: 30
prompt_init_text: поэт ассистент